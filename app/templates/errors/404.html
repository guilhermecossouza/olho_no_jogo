<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Página não encontrada | Olho no Jogo</title>

    <!-- Bootstrap 5 via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .erro-container {
            text-align: center;
            padding: 2rem;
            max-width: 600px;
        }

        .erro-codigo {
            font-size: 8rem;
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(135deg, #00d4ff 0%, #7b2ff7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
        }

        .erro-bola {
            font-size: 4rem;
            margin-bottom: 1rem;
            animation: girar 3s linear infinite;
            display: inline-block;
        }

        @keyframes girar {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        .erro-titulo {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .erro-texto {
            color: #b8b8d1;
            font-size: 1.1rem;
            margin-bottom: 2rem;
        }

        .btn-voltar {
            background: linear-gradient(135deg, #00d4ff 0%, #7b2ff7 100%);
            border: none;
            color: #fff;
            font-weight: 600;
            padding: 0.75rem 2rem;
            border-radius: 50px;
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-voltar:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(123, 47, 247, 0.4);
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="erro-container">
        <div class="erro-bola">⚽</div>
        <div class="erro-codigo">404</div>
        <h1 class="erro-titulo">Página não encontrada</h1>
        <p class="erro-texto">
            A bola foi pra fora! 🥅<br>
            O endereço que você tentou acessar não existe ou foi movido.
        </p>
        <a href="/" class="btn-voltar">⚽ Voltar para o início</a>
    </div>

</body>
</html>
